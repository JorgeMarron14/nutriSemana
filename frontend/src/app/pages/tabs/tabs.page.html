  <ion-tab-bar slot="bottom">

      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Plan</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="diets" routerLink="/tabs/diets">
      <ion-icon name="document-text-outline"></ion-icon>
      <ion-label>Dietas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="shopping-list" routerLink="/tabs/shopping-list">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Compra</ion-label>

    <ion-tab-button tab="chat" routerLink="/tabs/chat">
      <ion-icon name="chatbubble-ellipses-outline"></ion-icon>

    <ion-tab-button tab="settings" routerLink="/tabs/settings">
